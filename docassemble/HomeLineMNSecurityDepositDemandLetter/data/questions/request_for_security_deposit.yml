metadata:
  title: Ask for your Minnesota security deposit back
  short title: Request for security deposit
  description: >-
    Write a letter asking your Minnesota landlord to return your security deposit and any interest owed.
    Use this letter if your landlord kept the full deposit and gave you no written explanation.
  can_I_use_this_form: |
    Use this letter if you moved out of a Minnesota rental and your landlord kept your full deposit.
    If your landlord sent an explanation or returned part of the money, see HOME Line’s guide.
  before_you_start: |
    Find your landlord’s mailing address and the amount you paid for the deposit.
    Give your landlord your forwarding address. Use HOME Line’s guide to check when the deposit is due.
  when_you_are_finished: |
    Review the letter. Keep a copy and mail the letter to your landlord.
    If you do not hear back within 30 days, call HOME Line at 866-866-3546.
  maturity: production
  estimated_completion_minutes: 10
  estimated_completion_delta: 5
