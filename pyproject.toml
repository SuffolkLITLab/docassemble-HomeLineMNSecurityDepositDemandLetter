[build-system]
requires = [
    "setuptools==80.9.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "docassemble.HomeLineMNSecurityDepositDemandLetter"
version = "1.0"
description = "Request for security deposit in MN"
readme = "README.md"
authors = [
    { name = "Suffolk LIT Clinic", email = "litlab@suffolk.edu" },
]
dependencies = [
    "docassemble.AssemblyLine>=4.9.0",
    "docassemble.HOMELineTheme @ git+https://github.com/SuffolkLITLab/docassemble-HOMELineTheme.git@982ed42168856256e754088c2f83ae2457d90181",
]

[project.urls]
Homepage = "https://courtformsonline.org"

[tool.setuptools.packages.find]
where = [
    ".",
]
